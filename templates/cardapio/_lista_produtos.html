{% for categoria in categorias %}
  {% if categoria.produtos.all %}
    <h3 class="mt-4 mb-3" id="categoria-{{ categoria.pk }}">{{ categoria.nome }}</h3>
    <div class="row g-3">
      {% for produto in categoria.produtos.all %}
        {% include 'cardapio/_card_produto.html' %}
      {% endfor %}
    </div>
  {% endif %}
{% empty %}
  <p class="text-muted">Nenhum produto cadastrado ainda.</p>
{% endfor %}
