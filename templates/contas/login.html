{% extends 'base.html' %}
{% block titulo %}Entrar - BigBite{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="painel-vidro form-auth">
      <div class="text-center mb-3">
        <i class="ph ph-user-circle auth-icone"></i>
        <h2>Entrar</h2>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="btn btn-vermelho w-100 mt-2">Entrar</button>
      </form>
      <p class="mt-3 mb-0 text-center">Ainda não tem conta? <a href="{% url 'cadastro' %}" class="link-vermelho">Cadastre-se</a></p>
    </div>
  </div>
</div>
{% endblock %}
