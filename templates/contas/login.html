{% extends 'base.html' %}
{% block titulo %}Entrar - BigBite{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Entrar</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="btn btn-danger w-100 mt-3">Entrar</button>
    </form>
    <p class="mt-3">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
