{% extends 'base.html' %}
{% block titulo %}Cadastro - BigBite{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="painel-vidro form-auth">
      <div class="text-center mb-3">
        <i class="ph ph-user-plus auth-icone"></i>
        <h2>Criar conta</h2>
      </div>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button type="submit" class="btn btn-vermelho w-100 mt-2">Cadastrar</button>
      </form>
      <p class="mt-3 mb-0 text-center">Já tem conta? <a href="{% url 'login' %}" class="link-vermelho">Entrar</a></p>
    </div>
  </div>
</div>
{% endblock %}
