{% extends 'base.html' %}
{% block titulo %}Cadastro - BigBite{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Criar conta</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit" class="btn btn-danger w-100 mt-3">Cadastrar</button>
    </form>
    <p class="mt-3">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
  </div>
</div>
{% endblock %}
